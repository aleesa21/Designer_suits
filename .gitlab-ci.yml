# CI pipeline for the designer-suits-frontend React + Vite app.
#
# Required package.json scripts (add the ones you don't have yet):
#   "lint": "oxlint"                       (already present)
#   "build": "vite build"                  (already present)
#   "preview": "vite preview"              (already present)
#   "test:ci": "vitest run --coverage"     (needs Vitest — see chat)
#   "test:e2e": "playwright test"          (needs Playwright — see chat)
#
# Commit both package.json and package-lock.json.
# Do not commit node_modules.

stages:
  - validate
  - test
  - security
  - build
  - browser-test
  - deploy

default:
  image: node:22-alpine
  interruptible: true

  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure

  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push

  before_script:
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline --no-audit

variables:
  NODE_ENV: "test"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  VITE_CI: "true"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# Configuration validation
# ---------------------------------------------------------------------------

json_validation:
  stage: validate

  script:
    - |
      node <<'NODE'
      const fs = require("node:fs");

      const files = [
        "package.json",
        "package-lock.json",
        ".oxlintrc.json"
      ];

      for (const file of files) {
        if (!fs.existsSync(file)) {
          console.error(`Required JSON file is missing: ${file}`);
          process.exit(1);
        }

        try {
          JSON.parse(fs.readFileSync(file, "utf8"));
          console.log(`Valid JSON: ${file}`);
        } catch (error) {
          console.error(`Invalid JSON in ${file}`);
          console.error(error.message);
          process.exit(1);
        }
      }
      NODE

# ---------------------------------------------------------------------------
# Source-code linting
# ---------------------------------------------------------------------------

oxlint:
  stage: validate

  script:
    - |
      set +e

      echo "=== oxlint (console output) ==="
      npm run lint
      LINT_EXIT=$?

      echo "=== Writing oxlint JSON report for artifacts ==="
      npx oxlint --format json > oxlint-report.json || true

      exit $LINT_EXIT

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - oxlint-report.json

# ---------------------------------------------------------------------------
# React Doctor analysis
# ---------------------------------------------------------------------------

react_doctor:
  stage: validate

  script:
    - |
      set +e

      echo "=== React Doctor (console output) ==="
      npx react-doctor@latest . --scope full --blocking error
      DOCTOR_EXIT=$?

      echo "=== Writing React Doctor JSON report for artifacts ==="
      npx react-doctor@latest . --scope full --blocking none --json > react-doctor-report.json || true

      exit $DOCTOR_EXIT

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - react-doctor-report.json

# ---------------------------------------------------------------------------
# Unit and component tests
# ---------------------------------------------------------------------------
# Requires Vitest to be installed and a "test:ci" script in package.json.
# Until then this job will fail — either add Vitest (see chat) or comment
# this job out and re-enable it once tests land.

unit_tests:
  stage: test

  script:
    - npm run test:ci -- --reporter=verbose

  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'

  artifacts:
    when: always
    expire_in: 14 days

    paths:
      - coverage/
      - junit.xml

    reports:
      junit: junit.xml

      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

# ---------------------------------------------------------------------------
# Production dependency audit
# ---------------------------------------------------------------------------

npm_audit:
  stage: security

  script:
    - |
      set +e

      echo "=== npm audit (console output) ==="
      npm audit --omit=dev --audit-level=high
      AUDIT_EXIT=$?

      echo "=== Writing npm audit JSON report for artifacts ==="
      npm audit --omit=dev --json > npm-audit-report.json || true

      exit $AUDIT_EXIT

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - npm-audit-report.json

  allow_failure: false

# ---------------------------------------------------------------------------
# Static application security testing
# ---------------------------------------------------------------------------

semgrep_sast_scan:
  stage: security

  image:
    name: semgrep/semgrep:latest
    entrypoint: [""]

  before_script: []

  script:
    - |
      # --gitlab-sast-output writes the machine-readable report to a file
      # while leaving semgrep's normal text findings on stdout, so the
      # job log still shows every rule hit instead of only a rule count.
      semgrep scan \
        --config p/default \
        --error \
        --metrics=off \
        --exclude node_modules \
        --exclude dist \
        --exclude coverage \
        --exclude playwright-report \
        --exclude test-results \
        --gitlab-sast-output=gl-sast-report.json \
        .

  artifacts:
    when: always
    expire_in: 30 days
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json

# ---------------------------------------------------------------------------
# Dependency and configuration vulnerability scanning
# ---------------------------------------------------------------------------

trivy_filesystem:
  stage: security

  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  before_script: []

  cache:
    key: trivy-db
    paths:
      - .trivycache/
    policy: pull-push

  script:
    - |
      set +e

      echo "=== Trivy filesystem scan (console output) ==="
      trivy fs \
        --cache-dir .trivycache \
        --scanners vuln,misconfig \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --exit-code 1 \
        --format table \
        .
      TRIVY_EXIT=$?

      echo "=== Writing Trivy JSON report for artifacts ==="
      trivy fs \
        --cache-dir .trivycache \
        --scanners vuln,misconfig \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --exit-code 0 \
        --format json \
        --output trivy-report.json \
        .

      exit $TRIVY_EXIT

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-report.json

# ---------------------------------------------------------------------------
# Secret detection
# ---------------------------------------------------------------------------

gitleaks:
  stage: security

  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]

  before_script: []

  variables:
    GIT_DEPTH: "0"

  script:
    - |
      gitleaks git \
        --verbose \
        --redact \
        --report-format json \
        --report-path gitleaks-report.json \
        --exit-code 1 \
        .

  artifacts:
    when: always
    expire_in: 30 days

    paths:
      - gitleaks-report.json

# ---------------------------------------------------------------------------
# Reproducible Vite production build
# ---------------------------------------------------------------------------

vite_build:
  stage: build

  script:
    - npm run build
    - test -d dist
    - test -f dist/index.html
    - test -s dist/index.html
    - echo "=== dist/ contents ==="
    - ls -la dist
    - echo "Vite production build completed successfully."

  artifacts:
    name: "vite-dist-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days

    paths:
      - dist/

# ---------------------------------------------------------------------------
# Browser-level end-to-end tests
# ---------------------------------------------------------------------------
# Requires Playwright to be installed and a "test:e2e" script in
# package.json. Pin the image tag to match @playwright/test in
# package-lock.json.

playwright_e2e:
  stage: browser-test

  image: mcr.microsoft.com/playwright:v1.62.1-noble

  needs:
    - job: vite_build
      artifacts: true

  variables:
    CI: "true"
    PLAYWRIGHT_HTML_OPEN: "never"

  before_script:
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline --no-audit
    - npx playwright --version

  script:
    - |
      set -eu

      npm run preview -- \
        --host 0.0.0.0 \
        --port 4173 \
        --strictPort \
        > vite-preview.log 2>&1 &

      PREVIEW_PID=$!

      cleanup() {
        echo "Stopping Vite preview server."

        if kill -0 "$PREVIEW_PID" 2>/dev/null; then
          kill "$PREVIEW_PID" 2>/dev/null || true
          wait "$PREVIEW_PID" 2>/dev/null || true
        fi
      }

      trap cleanup EXIT INT TERM

      for attempt in $(seq 1 30); do
        if node -e "
          fetch('http://127.0.0.1:4173')
            .then(response => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1));
        "; then
          echo "Vite preview is ready."
          break
        fi

        if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then
          echo "Vite preview exited unexpectedly."
          cat vite-preview.log
          exit 1
        fi

        if [ "$attempt" -eq 30 ]; then
          echo "Vite preview did not become ready within 60 seconds."
          cat vite-preview.log
          exit 1
        fi

        echo "Waiting for Vite preview: attempt $attempt/30"
        sleep 2
      done

      npm run test:e2e -- --reporter=list

  after_script:
    - |
      echo "Vite preview output:"
      cat vite-preview.log 2>/dev/null || true

  artifacts:
    when: always
    expire_in: 14 days

    paths:
      - playwright-report/
      - test-results/
      - vite-preview.log

    reports:
      junit: test-results/e2e-junit.xml

# ---------------------------------------------------------------------------
# Deployment
# ---------------------------------------------------------------------------
# TODO: fill in your actual host. This repo has no hosting config checked
# in, so this is left as a Vercel example (matching the reference) — swap
# for your provider (Netlify, S3/CloudFront, your own server via rsync/ssh,
# etc.) or delete this section if deploys are handled elsewhere.

.vercel_deploy_base:
  stage: deploy
  before_script:
    - npm install --global vercel@latest
  cache: []

deploy_preview:
  extends: .vercel_deploy_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    on_stop: stop_preview
    auto_stop_in: 1 week
  script:
    - vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
    - vercel build --token="$VERCEL_TOKEN"
    - vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" | tee deploy-output.txt
    - echo "Preview URL:" && tail -n 1 deploy-output.txt

stop_preview:
  extends: .vercel_deploy_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    action: stop
  script:
    - echo "Preview environment stopped (Vercel deployment itself expires via auto_stop_in, this just closes the GitLab environment record)."

deploy_production:
  extends: .vercel_deploy_base
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production
    url: https://REPLACE-ME.vercel.app
  script:
    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
    - vercel build --prod --token="$VERCEL_TOKEN"
    - vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
